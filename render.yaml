services:
  - type: web
    name: grocery-shop-manager
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-db
          property: connectionString

databases:
  - name: grocery-db
    plan: free
